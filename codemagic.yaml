workflows:
  gaskuy-android-apk:
    name: GasKuy Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          cd customer_app
          flutter pub get
      - name: Build release APK
        script: |
          cd customer_app
          flutter build apk --release
    artifacts:
      - customer_app/build/app/outputs/flutter-apk/app-release.apk
